aid: 180-insurance
name: 180 Insurance
description: >-
  180 Seguros (180 Insurance) is the first tech-native insurer in Brazil, an
  SUSEP-authorized insurtech that lets fintechs, digital banks, credit
  cooperatives and other financial and non-financial businesses embed insurance
  into their own products through a single API — the Sagas API. The platform
  covers the full insurance lifecycle: product/combo listing, quotation
  (cotação), proposal (proposta), sale/policy issuance (venda), endorsements,
  renewals (renovações) and claims (sinistros), plus HMAC-signed webhooks for
  real-time visibility. Authentication is OAuth2 client-credentials via Auth0,
  errors follow RFC 9457 problem-details, and the company publishes a security
  posture including AICPA SOC 2, LGPD and SUSEP Circular 638 compliance. 180
  Seguros is backed by 8VC, Monashees, Dragoneer, Atlantico and Canary, and was
  added to the API Evangelist network as an 8VC portfolio company.
