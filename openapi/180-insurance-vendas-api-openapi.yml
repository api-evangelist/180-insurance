openapi: 3.2.0
info:
  title: Sagas Vendas API
  version: v1
  contact:
    email: engineers@180s.com.br
servers:
- url: //sagas.staging.180s.com.br
security:
- oauth: []
tags:
- name: Vendas
paths:
  /sagas/v1/documentos/vendas/{id-venda}/produtos/{id-produto}:
    get:
      responses:
        '200':
          description: ''
          content:
            application/pdf:
              schema: {}
      parameters:
      - in: path
        name: id-venda
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id-produto
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Vendas
      summary: Obter documento referente à venda
      description: 'Obter certificado de venda emitido para o cliente contratante.


        A resposta desse endpoint será em um formato de documento, contendo o header `Content-type: application/pdf`.'
      operationId: getSagasV1DocumentosVendasByIdVendaProdutosByIdProduto
      x-operation-id-source: derived
  /sagas/v1/obter-venda:
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/ObterVendaResposta
                properties:
                  instante-cancelamento:
                    type: string
                    format: date-time
                  atualizacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        instante-atualizacao:
                          type: string
                          format: date-time
                        dados-atualizacao:
                          type: object
                          properties:
                            status:
                              type: boolean
                          additionalProperties: false
                          required:
                          - status
                        descricao:
                          type: string
                        resumo-cotacao:
                          type: object
                          properties:
                            iof:
                              type: number
                              format: double
                              example: -1
                            instante-criacao:
                              type: string
                              format: date-time
                            valor-total-liquido:
                              type: number
                              format: double
                              example: -0.271484375
                            id-cotacao:
                              type: string
                              format: uuid
                            resumo-cotacao-produtos:
                              type: array
                              items:
                                type: object
                                properties:
                                  valor:
                                    type: number
                                    format: double
                                    example: -0.375
                                  valor-liquido:
                                    type: number
                                    format: double
                                    example: 1.5
                                  iof:
                                    type: number
                                    format: double
                                    example: 0.25
                                  propriedades:
                                    type: object
                                    title: camaleao.lib.properties.schema/Materialized
                                    additionalProperties:
                                      example: 3
                                  plano:
                                    type: string
                                  id-produto:
                                    type: string
                                    format: uuid
                                additionalProperties: false
                                required:
                                - valor
                                - iof
                                - valor-liquido
                                - id-produto
                            valor-total:
                              type: number
                              format: double
                              example: 0.47265625
                          additionalProperties: false
                          required:
                          - valor-total
                          - resumo-cotacao-produtos
                          - valor-total-liquido
                          - iof
                          - id-cotacao
                          - instante-criacao
                        tipo:
