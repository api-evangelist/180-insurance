openapi: 3.2.0
info:
  title: Sagas Sinistros API
  version: v1
  contact:
    email: engineers@180s.com.br
servers:
- url: //sagas.staging.180s.com.br
security:
- oauth: []
tags:
- name: Sinistros
paths:
  /sagas/v1/sinistros/whitelabel/gerar-url:
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/GerarUrlWhitelabelSinistrosResposta
                properties:
                  url:
                    type: string
                additionalProperties: false
                required:
                - url
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: camaleao.lib.schema.contracts.sagas.wire-in/GerarUrlWhitelabelSinistrosRequisicao
              properties:
                id-venda:
                  type: string
                  format: uuid
                id-usuario:
                  type: string
                detalhes-pagamento:
                  type: object
                  title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroDetalhesPagamento
                  properties:
                    beneficiario:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-in/BeneficiarioSinistro
                      properties:
                        tipo:
                          type: string
                          enum:
                          - segurado
                          - credor
                          - outro
                        nome:
                          type: string
                        cpf-ou-cnpj:
                          type: string
                          pattern: ^([0-9]{11}|[A-Z0-9]{12}[0-9]{2})$
                          example: '57036536306'
                      additionalProperties: false
                      required:
                      - tipo
                      - nome
                      - cpf-ou-cnpj
                    dados-pagamento:
                      type: object
                      properties:
                        metodo-pagamento:
                          type: string
                          enum:
                          - boleto
                          - pix-brcode
                          - ted
                          - pix
                        pix:
                          type: object
                          properties:
                            chave:
                              type: string
                            conta-bancaria:
                              type: object
                              title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoPixContaBancaria
                              properties:
                                agencia:
                                  type: string
                                  pattern: ^[0-9]*$
                                  example: '4400'
                                conta:
                                  type: string
                                  pattern: ^[0-9]*$
                                  example: '84002483'
                                agencia-digito-verificador:
                                  type: string
                                conta-digito-verificador:
                                  type: string
                                banco:
                                  type: string
                                  pattern: ^[0-9]{8}$
                                  example: '22135451'
                              additionalProperties: false
                              required:
                              - agencia
                              - conta
                              - banco
                          additionalProperties: false
                          example:
                            chave: =s}/D&=~x1
                        pix-brcode:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoPixBrcode
                          properties:
                            brcode:
                              type: string
                          additionalProperties: false
                          required:
                          - brcode
                        ted:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoTed
                          properties:
                            agencia:
                              type: string
                              pattern: ^[0-9]*$
                              example: '48602104'
                            conta:
                              type: string
                              pattern: ^[0-9]*$
                              example: '7850042199'
                            agencia-digito-verificador:
                              type: string
                            conta-digito-verificador:
                              type: string
                            banco:
                              type: string
                              pattern: ^[0-9]{3}$
                              example: '322'
                          additionalProperties: false
                          required:
                          - agencia
                          - conta
                          - banco
                        boleto:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoBoleto
                          properties:
                            codigo-de-barras:
                              type: string
                          additionalProperties: false
                          required:
                          - codigo-de-barras
                      additionalProperties: false
                      required:
                      - metodo-pagamento
                      example:
                        metodo-pagamento: boleto
                        pix:
                          chave: h*-\De#T$
                        pix-brcode:
                          brcode: '[k6PRN}O#'
                        boleto:
                          codigo-de-barras: Z`m<Osb
                  additionalProperties: false
                  required:
                  - beneficiario
                  - dados-pagamento
              additionalProperties: false
              required:
              - id-venda
        required: true
      tags:
      - Sinistros
      summary: Gerar URL de sinistro whitelabel
      description: '**⚠️ Endpoint em desenvolvimento (WIP).** O comportamento e contrato podem sofrer alterações.


        Gera uma URL temporária para gerenciamento de sinistros via whitelabel.


        A URL retornada expira conforme configuração do canal e deve ser usada dentro do período de validade.'
      operationId: postSagasV1SinistrosWhitelabelGerarUrl
      x-operation-id-source: derived
  /sagas/v1/sinistros/{numero-sinistro}:
    get:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/SinistroResposta
                properties:
                  recusa:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-out/RecusaSinistro
                    properties:
                      data:
                        type: string
                        format: date-time
                      descricao:
                        type: string
                    additionalProperties: false
                    required:
                    - data
                    - descricao
                  valor-restante:
                    type: number
                    format: double
                    example: 1.71875
                  valor:
                    type: number
                    format: double
                    example: 7.125
                  natureza:
                    type: string
                    enum:
                    - perda-de-renda-desemprego
                    - perda-de-renda-invalidez-fisica
                    - morte-natural
                    - morte-acidental
                  saldo-devedor:
                    type: number
                    format: double
                    example: -0.9375
                  pessoa-para-contato:
                    type: object
                    properties:
                      nome:
                        type: string
                      email:
                        type: string
                        pattern: ^[a-zA-Z0-9.!#$%&'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                        example: ib59Cq0N2EEuI902Jw7F5BV4KTMY1@ib59Cq0N2EEuI902Jw7F5BV4KTMY1.com
                      telefone:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.wire-in/NumeroTelefone
                        properties:
                          codigo-pais:
                            type: string
                            pattern: ^\d{1,3}$
                            example: '4'
                          codigo-area:
                            type: string
                            pattern: ^\d{1,3}$
                            example: '794'
                          numero-telefone:
                            type: string
                            pattern: ^\d{7,9}$
                            example: '491920704'
                        additionalProperties: false
                        required:
                        - codigo-area
                        - numero-telefone
                    additionalProperties: false
                    required:
                    - nome
                    example:
                      nome: '@c6HL6g'
                      email: yySPuCk734myq05C53IPH@yySPuCk734myq05C53IPH.com
                      telefone:
                        codigo-area: '10'
                        numero-telefone: 036831644
                  status:
                    type: string
                    enum:
                    - criado
                    - abertura-rejeitada
                    - pendente-de-dados-de-pagamento
                    - pendente-de-documentacao
                    - documentacao-em-analise
                    - recusado
                    - finalizado
                    - em-regulacao
                  cobertura:
                    type: string
                  numero-sinistro:
                    type: string
                  relato-do-ocorrido:
                    type: string
                  data-aviso:
                    type: string
                    format: date-time
                  documentacao:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-out/DocumentacaoSinistro
                    properties:
                      documentos-recebidos:
                        type: array
                        items:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-out/DocumentoSinistro
                          properties:
                            tipo:
                              type: string
                            titulo:
                              type: string
                            arquivos:
                              type: array
                              items:
                                type: object
                                title: camaleao.lib.schema.contracts.sagas.wire-out/ArquivoDocumentacaoSinistro
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  nome-arquivo:
                                    type: string
                                  data-envio:
                                    type: string
                                    format: date-time
                                  tipo-documento:
                                    type: string
                                  id-externo:
                                    type: string
                                additionalProperties: false
                                required:
                                - id
                                - nome-arquivo
                                - data-envio
                                - tipo-documento
                          additionalProperties: false
                          required:
                          - tipo
                          - titulo
                          - arquivos
                      documentos-pendentes:
                        type: array
                        items:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-out/DocumentoPendenteSinistro
                          properties:
                            tipo:
                              type: string
                            titulo:
                              type: string
                            data-solicitacao:
                              type: string
                              format: date-time
                            detalhe:
                              type: string
                          additionalProperties: false
                          required:
                          - tipo
                          - titulo
                          - data-solicitacao
                    additionalProperties: false
                    required:
                    - documentos-recebidos
                    - documentos-pendentes
                  franquia-paga:
                    type: number
                    format: double
                    example: 1.6875
                  pagamentos:
                    type: array
                    items:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-out/PagamentoSinistro
                      properties:
                        id:
                          type: string
                          format: uuid
                        valor:
                          type: number
                          format: double
                          example: 4
                        data-pagamento:
                          type: string
                          format: date-time
                      additionalProperties: false
                      required:
                      - id
                      - valor
                      - data-pagamento
                  data-ocorrencia:
                    type: string
                    format: date-time
                  solicitante:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-in/SolicitanteSinistro
                    properties:
                      nome:
                        type: string
                    additionalProperties: false
                    required:
                    - nome
                additionalProperties: false
                required:
                - numero-sinistro
                - valor
                - pagamentos
                - data-aviso
                - pessoa-para-contato
                - status
                - solicitante
                - data-ocorrencia
                - cobertura
                - valor-restante
      parameters:
      - in: path
        name: numero-sinistro
        description: ''
        required: true
        schema:
          type: string
      tags:
      - Sinistros
      summary: Obter detalhes de um sinistro
      description: '**⚠️ Endpoint em desenvolvimento (WIP).** O comportamento e contrato podem sofrer alterações.


        Retorna os detalhes completos de um sinistro a partir do seu número.


        A resposta inclui: status atual, valor total aprovado (`valor`), valor restante a pagar (`valor-restante`), lista de pagamentos realizados (`pagamentos`), cobertura acionada, datas de aviso e ocorrência, dados do solicitante e da pessoa para contato.


        Quando aplicável, a resposta também inclui:

        - `documentacao`: documentos solicitados e lista de arquivos enviados

        - `recusa`: motivo e data de recusa, caso o sinistro tenha sido recusado

        - `franquia-paga`: valor de franquia já pago pelo segurado

        - `natureza` e `relato-do-ocorrido`: detalhes narrativos do ocorrido'
      operationId: getSagasV1SinistrosByNumeroSinistro
      x-operation-id-source: derived
  /sagas/v1/sinistros/{numero-sinistro}/dados-pagamento:
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/SinistroResposta
                properties:
                  recusa:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-out/RecusaSinistro
                    properties:
                      data:
                        type: string
                        format: date-time
                      descricao:
                        type: string
                    additionalProperties: false
                    required:
                    - data
                    - descricao
                  valor-restante:
                    type: number
                    format: double
                    example: 2
                  valor:
                    type: number
                    format: double
                    example: -1.1875
                  natureza:
                    type: string
                    enum:
                    - perda-de-renda-desemprego
                    - perda-de-renda-invalidez-fisica
                    - morte-natural
                    - morte-acidental
                  saldo-devedor:
                    type: number
                    format: double
                    example: 1.8662109375
                  pessoa-para-contato:
                    type: object
                    properties:
                      nome:
                        type: string
                      email:
                        type: string
                        pattern: ^[a-zA-Z0-9.!#$%&'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                        example: KWG7Xo496z21MjMhN9Kq8OA8ALWVY6mKXFJMD94aqMuwn@KWG7Xo496z21MjMhN9Kq8OA8ALWVY6mKXFJMD94aqMuwn.com
                      telefone:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.wire-in/NumeroTelefone
                        properties:
                          codigo-pais:
                            type: string
                            pattern: ^\d{1,3}$
                            example: '29'
                          codigo-area:
                            type: string
                            pattern: ^\d{1,3}$
                            example: '2'
                          numero-telefone:
                            type: string
                            pattern: ^\d{7,9}$
                            example: '339225411'
                        additionalProperties: false
                        required:
                        - codigo-area
                        - numero-telefone
                    additionalProperties: false
                    required:
                    - nome
                    example:
                      nome: +W
                      email: QHY6jks1kHizMGg@QHY6jks1kHizMGg.com
                      telefone:
                        codigo-pais: '86'
                        codigo-area: '28'
                        numero-telefone: '2442599'
                  status:
                    type: string
                    enum:
                    - criado
                    - abertura-rejeitada
                    - pendente-de-dados-de-pagamento
                    - pendente-de-documentacao
                    - documentacao-em-analise
                    - recusado
                    - finalizado
                    - em-regulacao
                  cobertura:
                    type: string
                  numero-sinistro:
                    type: string
                  relato-do-ocorrido:
                    type: string
                  data-aviso:
                    type: string
                    format: date-time
                  documentacao:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-out/DocumentacaoSinistro
                    properties:
                      documentos-recebidos:
                        type: array
                        items:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-out/DocumentoSinistro
                          properties:
                            tipo:
                              type: string
                            titulo:
                              type: string
                            arquivos:
                              type: array
                              items:
                                type: object
                                title: camaleao.lib.schema.contracts.sagas.wire-out/ArquivoDocumentacaoSinistro
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  nome-arquivo:
                                    type: string
                                  data-envio:
                                    type: string
                                    format: date-time
                                  tipo-documento:
                                    type: string
                                  id-externo:
                                    type: string
                                additionalProperties: false
                                required:
                                - id
                                - nome-arquivo
                                - data-envio
                                - tipo-documento
                          additionalProperties: false
                          required:
                          - tipo
                          - titulo
                          - arquivos
                      documentos-pendentes:
                        type: array
                        items:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-out/DocumentoPendenteSinistro
                          properties:
                            tipo:
                              type: string
                            titulo:
                              type: string
                            data-solicitacao:
                              type: string
                              format: date-time
                            detalhe:
                              type: string
                          additionalProperties: false
                          required:
                          - tipo
                          - titulo
                          - data-solicitacao
                    additionalProperties: false
                    required:
                    - documentos-recebidos
                    - documentos-pendentes
                  franquia-paga:
                    type: number
                    format: double
                    example: 3.09375
                  pagamentos:
                    type: array
                    items:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-out/PagamentoSinistro
                      properties:
                        id:
                          type: string
                          format: uuid
                        valor:
                          type: number
                          format: double
                          example: -7.5
                        data-pagamento:
                          type: string
                          format: date-time
                      additionalProperties: false
                      required:
                      - id
                      - valor
                      - data-pagamento
                  data-ocorrencia:
                    type: string
                    format: date-time
                  solicitante:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-in/SolicitanteSinistro
                    properties:
                      nome:
                        type: string
                    additionalProperties: false
                    required:
                    - nome
                additionalProperties: false
                required:
                - numero-sinistro
                - valor
                - pagamentos
                - data-aviso
                - pessoa-para-contato
                - status
                - solicitante
                - data-ocorrencia
                - cobertura
                - valor-restante
      parameters:
      - in: path
        name: numero-sinistro
        description: ''
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroDetalhesPagamento
              properties:
                beneficiario:
                  type: object
                  title: camaleao.lib.schema.contracts.sagas.wire-in/BeneficiarioSinistro
                  properties:
                    tipo:
                      type: string
                      enum:
                      - segurado
                      - credor
                      - outro
                    nome:
                      type: string
                    cpf-ou-cnpj:
                      type: string
                      pattern: ^([0-9]{11}|[A-Z0-9]{12}[0-9]{2})$
                      example: '91911881000310'
                  additionalProperties: false
                  required:
                  - tipo
                  - nome
                  - cpf-ou-cnpj
                dados-pagamento:
                  type: object
                  properties:
                    metodo-pagamento:
                      type: string
                      enum:
                      - boleto
                      - pix-brcode
                      - ted
                      - pix
                    pix:
                      type: object
                      properties:
                        chave:
                          type: string
                        conta-bancaria:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoPixContaBancaria
                          properties:
                            agencia:
                              type: string
                              pattern: ^[0-9]*$
                              example: '267'
                            conta:
                              type: string
                              pattern: ^[0-9]*$
                              example: '2530911315'
                            agencia-digito-verificador:
                              type: string
                            conta-digito-verificador:
                              type: string
                            banco:
                              type: string
                              pattern: ^[0-9]{8}$
                              example: '12088076'
                          additionalProperties: false
                          required:
                          - agencia
                          - conta
                          - banco
                      additionalProperties: false
                      example:
                        conta-bancaria:
                          agencia: '323805'
                          conta: '29081384'
                          agencia-digito-verificador: muipEpy
                          conta-digito-verificador: ?w@$SP
                          banco: 08584274
                    pix-brcode:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoPixBrcode
                      properties:
                        brcode:
                          type: string
                      additionalProperties: false
                      required:
                      - brcode
                    ted:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoTed
                      properties:
                        agencia:
                          type: string
                          pattern: ^[0-9]*$
                          example: '3'
                        conta:
                          type: string
                          pattern: ^[0-9]*$
                          example: '8687379080'
                        agencia-digito-verificador:
                          type: string
                        conta-digito-verificador:
                          type: string
                        banco:
                          type: string
                          pattern: ^[0-9]{3}$
                          example: '051'
                      additionalProperties: false
                      required:
                      - agencia
                      - conta
                      - banco
                    boleto:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-in/SinistroPagamentoBoleto
                      properties:
                        codigo-de-barras:
                          type: string
                      additionalProperties: false
                      required:
                      - codigo-de-barras
                  additionalProperties: false
                  required:
                  - metodo-pagamento
                  example:
                    metodo-pagamento: pix
                    pix:
                      conta-bancaria:
                        agencia: '964574'
                        conta: '868'
                        agencia-digito-verificador: Wj3S-Z8)IKa
                        conta-digito-verificador: K'
                        banco: '28069934'
                    ted:
                      agencia: '49275489'
                      conta: '4545975447'
                      conta-digito-verificador: (5L~#0<UR
                      banco: '583'
                    boleto:
                      codigo-de-barras: qXH^
              additionalProperties: false
              required:
              - beneficiario
              - dados-pagamento
        required: true
      tags:
      - Sinistros
      summary: Enviar os dados de pagamento de um sinistro
      operationId: postSagasV1SinistrosByNumeroSinistroDadosPagamento
      x-operation-id-source: derived
  /sagas/v1/sinistros/{numero-sinistro}/documentos/{file-id}:
    get:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema: {}
      parameters:
      - in: path
        name: numero-sinistro
        description: ''
        required: true
        schema:
          type: string
      - in: path
        name: file-id
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Sinistros
      summary: Baixar arquivo de documentação de sinistro
      description: '**⚠️ Endpoint em desenvolvimento (WIP).** O comportamento e contrato podem sofrer alterações.


        Baixa o arquivo de documentação identificado por `file-id` vinculado ao sinistro.


        A resposta é o conteúdo binário do arquivo com os headers `Content-Type` e `Content-Disposition` correspondentes ao arquivo original enviado.'
      operationId: getSagasV1SinistrosByNumeroSinistroDocumentosByFileId
      x-operation-id-source: derived
  /sagas/v1/sinistros/{numero-sinistro}/documentos/{file-id}/download-url:
    get:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/SinistroDocumentoDownloadUrlResposta
                properties:
                  download-url:
