openapi: 3.2.0
info:
  title: Sagas Cotações API
  version: v1
  contact:
    email: engineers@180s.com.br
servers:
- url: //sagas.staging.180s.com.br
security:
- oauth: []
tags:
- name: Cotações
paths:
  /sagas/v1/cotacoes:
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/CotacaoComboResposta
                properties:
                  cotacao-produtos:
                    type: array
                    items:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-out/CotacaoProdutoResposta
                      properties:
                        valor:
                          type: number
                          format: double
                          example: -0.5
                        instante-vigencia-inicio:
                          type: string
                          format: date-time
                        valor-liquido:
                          type: number
                          format: double
                          example: -0.3984375
                        iof:
                          type: number
                          format: double
                          example: -3.703125
                        propriedades:
                          type: object
                          title: camaleao.lib.properties.schema/Materialized
                          additionalProperties:
                            example: J
                        plano:
                          type: string
                        id-produto:
                          type: string
                          format: uuid
                        itens:
                          type: array
                          items:
                            type: object
                            title: camaleao.lib.schema.contracts.sagas.wire-out/ItemCotacaoProduto
                            properties:
                              chave-item:
                                type: string
                              lmi:
                                type: number
                                format: double
                                example: 1
                              valor-liquido:
                                type: number
                                format: double
                                example: 0.408935546875
                            additionalProperties: false
                            required:
                            - chave-item
                        instante-vigencia-fim:
                          type: string
                          format: date-time
                      additionalProperties: false
                      required:
                      - valor
                      - itens
                      - iof
                      - valor-liquido
                      - id-produto
                  valida-ate:
                    type: string
                    format: date-time
                  metadados:
                    type: object
                    title: camaleao.lib.schema.shared.model/Metadata
                    additionalProperties:
                      type: string
