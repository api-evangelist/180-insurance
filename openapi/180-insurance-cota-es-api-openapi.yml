      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: camaleao.lib.schema.contracts.sagas.wire-in/CotacaoComboRequisicao
              properties:
                id-combo-produto:
                  type: string
                  format: uuid
                produtos:
                  type: array
                  items:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.wire-in/CotacaoProdutoRequisicao
                    properties:
                      instante-vigencia-inicio:
                        type: string
                        format: date-time
                      percentual-comissao:
                        type: number
                        format: double
                        example: 1.5
                      premio-requerido:
                        type: number
                        format: double
                        example: 2
                      segmentacao:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.wire-in/CotacaoProdutoSegmentacao
                        properties:
                          cpf-ou-cnpj:
                            type: string
                            pattern: ^([0-9]{11}|[A-Z0-9]{12}[0-9]{2})$
                            example: JKK31296000105
                          celular:
                            type: object
                            title: camaleao.lib.schema.contracts.sagas.wire-in/CotacaoProdutoSegmentacaoCelular
                            properties:
                              marca:
                                type: string
                                enum:
                                - nothing
                                - panasonic
                                - redmagic
                                - samsung
                                - asus
                                - lenovo
                                - realme
                                - motorola
                                - iqoo
                                - micromax
                                - poco
                                - oppo
                                - lava
                                - tecno
                                - meizu
                                - honor
                                - oneplus
                                - zte
                                - nokia
                                - xiaomi
                                - apple
                                - razer
                                - sony
                                - sharp
                                - google
                                - tcl
                                - infinix
                                - blackberry
                                - alcatel
                                - vivo
                              modelo:
                                type: string
                                pattern: ^[a-zA-Z][\w\s\+]*[\w\+]$
                                example: aUj4QIz
                            additionalProperties: false
                            required:
                            - marca
                            - modelo
                          sexo:
                            type: string
                            enum:
                            - feminino
                            - masculino
                          data-nascimento:
                            type: string
                            pattern: ^\d{4}-\d{2}-\d{2}$
                            example: '1964-11-19'
                          custo-financiamento:
                            type: object
                            title: camaleao.lib.schema.contracts.sagas.wire-in/SegmentoCustoFinanciamento
                            properties:
                              iof:
                                type: number
                                format: double
                                example: 0.6953125
                              taxa-juros:
                                type: number
                                format: double
                                example: 0.5
                            additionalProperties: false
                            required:
                            - iof
                            - taxa-juros
                        additionalProperties: false
                      propriedades:
                        type: object
                        title: camaleao.lib.properties.schema/Materialized
                        additionalProperties:
                          example: -2.5
                      comissoes:
                        type: array
                        items:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/Comissao
                          properties:
                            id-intermediario:
                              type: string
                              format: uuid
                            percentual-comissao:
                              type: number
                              format: double
                              example: 1.53125
                          additionalProperties: false
                          required:
                          - id-intermediario
                          - percentual-comissao
                      plano:
                        type: string
                      id-produto:
                        type: string
                        format: uuid
                      itens:
                        type: array
                        items:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/CotacaoProdutoItemRequisicao
                          properties:
                            chave-item:
                              type: string
                            premio:
                              type: number
                              format: double
                              example: 4.7265625
                            limite-maximo-indenizacao:
                              type: number
                              format: double
                              example: 0.625
                          additionalProperties: false
                          required:
                          - chave-item
                      instante-vigencia-fim:
                        type: string
                        format: date-time
                    additionalProperties: false
                    required:
                    - id-produto
                risco-segurado:
                  type: object
                  properties:
                    tipo:
                      type: string
                      enum:
                      - risco-generico
                      - residencial
                      - celular
                      - lmi-variavel
                      - divida-e-residencial
                      - mercadoria
                      - divida
                      - cliente-segurado
                    residencial:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoResidencial
                      properties:
                        endereco:
                          type: object
                          properties:
                            logradouro:
                              type: string
                            numero:
                              type: string
                            complemento:
                              type:
                              - string
                              - 'null'
                            bairro:
                              type: string
                            cidade:
                              type: string
                            estado:
                              type: string
                              enum:
                              - TO
                              - RN
                              - SC
                              - AP
                              - PR
                              - SE
                              - GO
                              - RJ
                              - PI
                              - MG
                              - AL
                              - PE
                              - SP
                              - MA
                              - CE
                              - RO
                              - BA
                              - RS
                              - AC
                              - ES
                              - MT
                              - RR
                              - PB
                              - PA
                              - DF
                              - MS
                              - AM
                            cep:
                              type: string
                              pattern: ^[0-9]{8}$
                              example: '58849078'
                            tipo-residencia:
                              type: string
                              enum:
                              - apartamento
                              - casa
                          additionalProperties: false
                          required:
                          - logradouro
                          - numero
                          - bairro
                          - cidade
                          - estado
                          - cep
                        tipo-construcao-residencia:
                          type: string
                          enum:
                          - mista-e-inferior
                          - superior
                          - solida
                        tipo-bem-segurado-residencia:
                          type: string
                          enum:
                          - predio-e-conteudo
                          - predio
                        tipo-risco-residencia:
                          type: string
                          enum:
                          - escritorio-ou-consultorio
                          - servico
                          - desocupado
                          - comercio
                          - deposito
                          - industria
                      additionalProperties: false
                      required:
                      - endereco
                    risco-generico:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoGenerico
                      properties:
                        id-externo:
                          type: string
                        descricao:
                          type: string
                        categoria:
                          type: string
                      additionalProperties: false
                      required:
                      - id-externo
                      - descricao
                      - categoria
                    mercadoria:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoMercadoria
                      properties:
                        categoria:
                          type: string
                        data-venda-garantia-estendida:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          example: '2019-10-01'
                        id-externo:
                          type: string
                        produto-novo:
                          type: boolean
                        meses-garantia-fabricante:
                          type: integer
                          format: int32
                          example: 2
                        descricao:
                          type: string
                        fim-garantia-original:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          example: '1975-07-22'
                        data-venda-mercadoria:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          example: '2000-06-17'
                        marca:
                          type: string
                        codigo-ean:
                          type: string
                        preco:
                          type: number
                          format: double
                          example: -6.9296875
                        sub-categoria:
                          type: string
                      additionalProperties: false
                      required:
                      - preco
                      - categoria
                      - id-externo
                      - descricao
                      - fim-garantia-original
                      - marca
                    divida:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoDivida
                      properties:
                        id-externo:
                          type: string
                        descricao:
                          type: string
                        categoria:
                          type: string
                        capital-financiado:
                          type: number
                          format: double
                          example: 0.806640625
                        prazo:
                          type: integer
                          format: int32
                          example: 4
                        mes-ano-parcela-vigente:
                          type: string
                          pattern: ^\d{4}-\d{2}$
                          example: 1976-09
                        valor-parcela:
                          type: number
                          format: double
                          example: 3.296875
                        parcela-vencimento-dia-do-mes:
                          type: integer
                          format: int32
                          example: 12
                      additionalProperties: false
                      required:
                      - id-externo
                      - descricao
                      - categoria
                      - capital-financiado
                      - prazo
                      - mes-ano-parcela-vigente
                    divida-e-residencial:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoDividaEResidencial
                      properties:
                        endereco:
                          type: object
                          properties:
                            logradouro:
                              type: string
                            numero:
                              type: string
                            complemento:
                              type:
                              - string
                              - 'null'
                            bairro:
                              type: string
                            cidade:
                              type: string
                            estado:
                              type: string
                              enum:
                              - TO
                              - RN
                              - SC
                              - AP
                              - PR
                              - SE
                              - GO
                              - RJ
                              - PI
                              - MG
                              - AL
                              - PE
                              - SP
                              - MA
                              - CE
                              - RO
                              - BA
                              - RS
                              - AC
                              - ES
                              - MT
                              - RR
                              - PB
                              - PA
                              - DF
                              - MS
                              - AM
                            cep:
                              type: string
                              pattern: ^[0-9]{8}$
                              example: '11870834'
                            tipo-residencia:
                              type: string
                              enum:
                              - apartamento
                              - casa
                          additionalProperties: false
                          required:
                          - logradouro
                          - numero
                          - bairro
                          - cidade
                          - estado
                          - cep
                        tipo-construcao-residencia:
                          type: string
                          enum:
                          - mista-e-inferior
                          - superior
                          - solida
                        tipo-bem-segurado-residencia:
                          type: string
                          enum:
                          - predio-e-conteudo
                          - predio
                        tipo-risco-residencia:
                          type: string
                          enum:
                          - escritorio-ou-consultorio
                          - servico
                          - desocupado
                          - comercio
                          - deposito
                          - industria
                        id-externo:
                          type: string
                        descricao:
                          type: string
                        categoria:
                          type: string
                      additionalProperties: false
                      required:
                      - endereco
                      - id-externo
                      - descricao
                      - categoria
                    celular:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoCelular
                      properties:
                        marca:
                          type: string
                          enum:
                          - nothing
                          - panasonic
                          - redmagic
                          - samsung
                          - asus
                          - lenovo
                          - realme
                          - motorola
                          - iqoo
                          - micromax
                          - poco
                          - oppo
                          - lava
                          - tecno
                          - meizu
                          - honor
                          - oneplus
                          - zte
                          - nokia
                          - xiaomi
                          - apple
                          - razer
                          - sony
                          - sharp
                          - google
                          - tcl
                          - infinix
                          - blackberry
                          - alcatel
                          - vivo
                        modelo:
                          type: string
                          pattern: ^[a-zA-Z][\w\s\+]*[\w\+]$
                          example: ap2Tcdz
                        valor:
                          type: number
                          format: double
                          example: 1.125
                        imei:
                          type: string
                          pattern: ^[0-9]*$
                          example: '504447460595923'
                        nota-fiscal:
                          type: string
                          pattern: ^[0-9]*$
                          example: '63302'
                      additionalProperties: false
                      required:
                      - marca
                      - modelo
                      - valor
                    lmi-variavel:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.model/RiscoLmiVariavel
                      properties:
                        id-externo:
                          type: string
                        descricao:
                          type: string
                        categoria:
                          type: string
                        lmi:
                          type: number
                          format: double
                          example: 6.796875
                        mes-ano-parcela-vigente:
                          type: string
                          pattern: ^\d{4}-\d{2}$
                          example: 1941-09
                      additionalProperties: false
                      required:
                      - descricao
                      - categoria
                      - lmi
                      - mes-ano-parcela-vigente
                  additionalProperties: false
                  required:
                  - tipo
                  example:
                    tipo: lmi-variavel
                    risco-generico:
                      id-externo: zQXs%2
                      descricao: X+gh{
                      categoria: do55Ne
                    divida:
                      id-externo: z3
                      descricao: _
                      categoria: '|2Z''mo'
                      capital-financiado: 1.5
                      prazo: 8
                      mes-ano-parcela-vigente: 1968-11
                      valor-parcela: 0.4412841796875
                      parcela-vencimento-dia-do-mes: 12
                    celular:
                      marca: vivo
                      modelo: apMd4290nnYz
                      valor: 1
                      nota-fiscal: '1'
                    lmi-variavel:
                      descricao: M}<y2npQE"
                      categoria: 1^o%{"F&
                      lmi: 0.375
                      mes-ano-parcela-vigente: 1974-11
                cliente-segurado:
                  type: object
                  properties:
                    tipo:
                      type: string
                      enum:
                      - pessoa-fisica
                      - pessoa-juridica
                    pessoa-fisica:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-in/PessoaFisica
                      properties:
                        id-externo:
                          type: string
                        data-nascimento:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          example: '1989-07-07'
                        sexo:
                          type: string
                          enum:
                          - feminino
                          - masculino
                        endereco:
                          type: object
                          properties:
                            estado:
                              type: string
                              enum:
                              - TO
                              - RN
                              - SC
                              - AP
                              - PR
                              - SE
                              - GO
                              - RJ
                              - PI
                              - MG
                              - AL
                              - PE
                              - SP
                              - MA
                              - CE
                              - RO
                              - BA
                              - RS
                              - AC
                              - ES
                              - MT
                              - RR
                              - PB
                              - PA
                              - DF
                              - MS
                              - AM
                            cep:
                              type: string
                              pattern: ^[0-9]{8}$
                              example: '10167934'
                            tipo-residencia:
                              type: string
                              enum:
                              - apartamento
                              - casa
                            logradouro:
                              type: string
                            numero:
                              type: string
                            bairro:
                              type: string
                            cidade:
                              type: string
                            complemento:
                              type:
                              - string
                              - 'null'
                          additionalProperties: false
                          required:
                          - estado
                          - cep
                          - logradouro
                          - numero
                          - bairro
                          - cidade
                        pep:
                          type: boolean
                        email:
                          type: string
                          pattern: ^[a-zA-Z0-9.!#$%&'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                          example: Jw0jg9@Jw0jg9.com
                        telefone:
                          type: object
                          title: camaleao.lib.schema.contracts.sagas.wire-in/NumeroTelefone
                          properties:
                            codigo-pais:
                              type: string
                              pattern: ^\d{1,3}$
                              example: '8'
                            codigo-area:
                              type: string
                              pattern: ^\d{1,3}$
                              example: '974'
                            numero-telefone:
                              type: string
                              pattern: ^\d{7,9}$
                              example: '739642469'
                          additionalProperties: false
                          required:
                          - codigo-area
                          - numero-telefone
                        nome-completo:
                          type: string
                        cpf:
                          type: string
                          pattern: ^([0-9]{11})$
                          example: '14243542937'
                        nome-social:
                          type: string
                      additionalProperties: false
                      required:
                      - cpf
                      - endereco
                      - nome-completo
                    pessoa-juridica:
                      type: object
                      title: camaleao.lib.schema.contracts.sagas.wire-in/PessoaJuridica
                      properties:
                        cnpj:
                          type: string
                          pattern: ^[A-Z0-9]{12}[0-9]{2}$
