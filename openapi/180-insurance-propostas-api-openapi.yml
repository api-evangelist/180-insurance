openapi: 3.2.0
info:
  title: Sagas Propostas API
  version: v1
  contact:
    email: engineers@180s.com.br
servers:
- url: //sagas.staging.180s.com.br
security:
- oauth: []
tags:
- name: Propostas
paths:
  /sagas/v1/boleto/{payment-intent-id}:
    get:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema: {}
        '204':
          description: ''
          content:
            '*/*':
              schema: {}
      parameters:
      - in: path
        name: payment-intent-id
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Propostas
      summary: Obter boleto
      description: Retorna o PDF do boleto. Caso o documento ainda esteja sendo gerado, responde 204 — o cliente deve tentar novamente em seguida.
      operationId: getSagasV1BoletoByPaymentIntentId
      x-operation-id-source: derived
  /sagas/v1/documentos/propostas/{id-proposta}/produtos/{id-produto}:
    get:
      responses:
        '200':
          description: ''
          content:
            application/pdf:
              schema: {}
      parameters:
      - in: path
        name: id-proposta
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id-produto
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Propostas
      summary: Obter documento referente à proposta
      description: 'Obter o documento de uma proposta gerada.


        A resposta desse endpoint será em um formato de documento, contendo o header `Content-type: application/pdf`.'
      operationId: getSagasV1DocumentosPropostasByIdPropostaProdutosByIdProduto
      x-operation-id-source: derived
  /sagas/v1/propostas:
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/CriarPropostaComboResposta
                properties:
                  instante-cancelamento:
                    type: string
                    format: date-time
                  instante-atualizacao:
                    type: string
                    format: date-time
                  valida-ate:
                    type: string
                    format: date-time
                  atributos-emissao:
                    type: object
                    title: camaleao.lib.schema.contracts.sagas.model/AtributosEmissao
                    properties:
                      aplicacao:
                        type: string
                      usuario-emissor:
                        type: string
                      id-ponto-venda:
                        type: string
                      nome-exibicao-produto:
                        type: string
                    additionalProperties: false
                  id-renovacao:
                    type: string
                    format: uuid
                  id-proposta:
                    type: string
                    format: uuid
                  id-proposta-parceiro:
                    type: string
                    pattern: ^[A-Za-z0-9._-]+$
                    example: '742097796478626099366378083944'
                  status:
                    type: string
                    enum:
                    - cancelada
                    - expirada
                    - pendente
                    - completa
                    - cancelada-internamente
                  id-cancelamento:
                    type: string
                    format: uuid
                  instante-criacao:
                    type: string
                    format: date-time
                  risco-segurado:
                    type: object
                    properties:
                      tipo:
                        type: string
                        enum:
                        - risco-generico
                        - residencial
                        - celular
                        - lmi-variavel
                        - divida-e-residencial
                        - mercadoria
                        - divida
                        - cliente-segurado
                      residencial:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoResidencial
                        properties:
                          endereco:
                            type: object
                            properties:
                              logradouro:
                                type: string
                              numero:
                                type: string
                              complemento:
                                type:
                                - string
                                - 'null'
                              bairro:
                                type: string
                              cidade:
                                type: string
                              estado:
                                type: string
                                enum:
                                - TO
                                - RN
                                - SC
                                - AP
                                - PR
                                - SE
                                - GO
                                - RJ
                                - PI
                                - MG
                                - AL
                                - PE
                                - SP
                                - MA
                                - CE
                                - RO
                                - BA
                                - RS
                                - AC
                                - ES
                                - MT
                                - RR
                                - PB
                                - PA
                                - DF
                                - MS
                                - AM
                              cep:
                                type: string
                                pattern: ^[0-9]{8}$
                                example: '20510183'
                              tipo-residencia:
                                type: string
                                enum:
                                - apartamento
                                - casa
                            additionalProperties: false
                            required:
                            - logradouro
                            - numero
                            - bairro
                            - cidade
                            - estado
                            - cep
                          tipo-construcao-residencia:
                            type: string
                            enum:
                            - mista-e-inferior
                            - superior
                            - solida
                          tipo-bem-segurado-residencia:
                            type: string
                            enum:
                            - predio-e-conteudo
                            - predio
                          tipo-risco-residencia:
                            type: string
                            enum:
                            - escritorio-ou-consultorio
                            - servico
                            - desocupado
                            - comercio
                            - deposito
                            - industria
                        additionalProperties: false
                        required:
                        - endereco
                      risco-generico:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoGenerico
                        properties:
                          id-externo:
                            type: string
                          descricao:
                            type: string
                          categoria:
                            type: string
                        additionalProperties: false
                        required:
                        - id-externo
                        - descricao
                        - categoria
                      mercadoria:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoMercadoria
                        properties:
                          categoria:
                            type: string
                          data-venda-garantia-estendida:
                            type: string
                            pattern: ^\d{4}-\d{2}-\d{2}$
                            example: '1968-07-11'
                          id-externo:
                            type: string
                          produto-novo:
                            type: boolean
                          meses-garantia-fabricante:
                            type: integer
                            format: int32
                            example: 448
                          descricao:
                            type: string
                          fim-garantia-original:
                            type: string
                            pattern: ^\d{4}-\d{2}-\d{2}$
                            example: '2031-11-02'
                          data-venda-mercadoria:
                            type: string
                            pattern: ^\d{4}-\d{2}-\d{2}$
                            example: '1962-05-10'
                          marca:
                            type: string
                          codigo-ean:
                            type: string
                          preco:
                            type: number
                            format: double
                            example: 2.06640625
                          sub-categoria:
                            type: string
                        additionalProperties: false
                        required:
                        - preco
                        - categoria
                        - id-externo
                        - descricao
                        - fim-garantia-original
                        - marca
                      divida:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoDivida
                        properties:
                          id-externo:
                            type: string
                          descricao:
                            type: string
                          categoria:
                            type: string
                          capital-financiado:
                            type: number
                            format: double
                            example: 0.8359375
                          prazo:
                            type: integer
                            format: int32
                            example: 13
                          mes-ano-parcela-vigente:
                            type: string
                            pattern: ^\d{4}-\d{2}$
                            example: 1922-07
                          valor-parcela:
                            type: number
                            format: double
                            example: 0.25
                          parcela-vencimento-dia-do-mes:
                            type: integer
                            format: int32
                            example: 31
                        additionalProperties: false
                        required:
                        - id-externo
                        - descricao
                        - categoria
                        - capital-financiado
                        - prazo
                        - mes-ano-parcela-vigente
                      divida-e-residencial:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoDividaEResidencial
                        properties:
                          endereco:
                            type: object
                            properties:
                              logradouro:
                                type: string
                              numero:
                                type: string
                              complemento:
                                type:
                                - string
                                - 'null'
                              bairro:
                                type: string
                              cidade:
                                type: string
                              estado:
                                type: string
                                enum:
