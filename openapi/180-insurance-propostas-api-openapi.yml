                          tipo-residencia: casa
                        tipo-risco-residencia: deposito
                        id-externo: EBo\g&
                        descricao: V[06(
                        categoria: '@F"Bm,$|j'
                      celular:
                        marca: alcatel
                        modelo: a8OdcmM0fISz
                        valor: 1
