                                cpf-ou-cnpj:
                                  type: string
                                  pattern: ^([0-9]{11}|[A-Z0-9]{12}[0-9]{2})$
                                  example: UU3Y00S9000898
                                assinatura:
                                  type: object
                                  properties:
                                    hash:
                                      type: string
                                    versao:
