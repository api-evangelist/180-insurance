                                - RN
                                - SC
                                - AP
                                - PR
                                - SE
                                - GO
                                - RJ
                                - PI
                                - MG
                                - AL
                                - PE
                                - SP
                                - MA
                                - CE
                                - RO
                                - BA
                                - RS
                                - AC
                                - ES
                                - MT
                                - RR
                                - PB
                                - PA
                                - DF
                                - MS
                                - AM
                              cep:
                                type: string
                                pattern: ^[0-9]{8}$
                                example: '85448706'
                              tipo-residencia:
                                type: string
                                enum:
                                - apartamento
                                - casa
                            additionalProperties: false
                            required:
                            - logradouro
                            - numero
                            - bairro
                            - cidade
                            - estado
                            - cep
                          tipo-construcao-residencia:
                            type: string
                            enum:
                            - mista-e-inferior
                            - superior
                            - solida
                          tipo-bem-segurado-residencia:
                            type: string
                            enum:
                            - predio-e-conteudo
                            - predio
                          tipo-risco-residencia:
                            type: string
                            enum:
                            - escritorio-ou-consultorio
                            - servico
                            - desocupado
                            - comercio
                            - deposito
                            - industria
                          id-externo:
                            type: string
                          descricao:
                            type: string
                          categoria:
                            type: string
                        additionalProperties: false
                        required:
                        - endereco
                        - id-externo
                        - descricao
                        - categoria
                      celular:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoCelular
                        properties:
                          marca:
                            type: string
                            enum:
