                  proposta-produtos:
                    type: array
                    items:
                      type: object
                      properties:
                        pendencias:
                          type: array
                          items:
                            type: string
                            enum:
                            - pagamento
                            - aceite
                            - geracao-documentos
                          uniqueItems: true
                        instante-vigencia-inicio:
                          type: string
                          format: date-time
                        instante-atualizacao:
                          type: string
                          format: date-time
                        pagamento:
                          type: object
                          properties:
                            debito-em-conta:
                              type: object
                              properties:
                                conta-bancaria:
                                  type: object
                                  title: camaleao.lib.schema.contracts.sagas.model/ContaBancaria
                                  properties:
                                    banco:
                                      type: string
                                      pattern: ^([0-9]{3}|[0-9]{8})$
                                      example: '31314253'
                                    agencia:
                                      type: string
                                      pattern: ^[0-9]*$
                                      example: '948459'
                                    conta:
                                      type: string
                                      pattern: ^[0-9]*$
                                      example: '8428994572'
                                    agencia-digito-verificador:
                                      type: string
                                    conta-digito-verificador:
                                      type: string
                                  additionalProperties: false
                                  required:
                                  - banco
                                  - agencia
                                  - conta
                                parcelas:
                                  type: integer
                                  format: int32
                                  example: 15
                              additionalProperties: false
                              required:
                              - conta-bancaria
                              - parcelas
                            propriedades:
                              type: object
                              title: camaleao.lib.properties.schema/Materialized
                              additionalProperties:
                                example: 3
                            gateway-session-180:
                              type: object
                              title: camaleao.lib.schema.contracts.sagas.model/GatewaySession180
                              properties:
                                gateway-session:
                                  type: string
                                url:
                                  type: string
                                metodo:
                                  type: object
                                  title: camaleao.lib.schema.contracts.sagas.model/MetodoPagamento
                                  properties:
                                    tipo:
                                      type: string
                                      enum:
                                      - boleto
                                      - pix
                                      - cartao-de-credito
                                    cobranca:
                                      type: object
                                      title: camaleao.lib.schema.contracts.sagas.model/Cobranca
                                      properties:
                                        tipo:
                                          type: string
                                          enum:
                                          - recorrente
                                          - unica
                                          - parcelada
                                        ciclos:
                                          type: integer
                                          format: int32
                                          example: 1
                                      additionalProperties: false
                                      required:
                                      - tipo
                                      - ciclos
                                      example:
                                        tipo: parcelada
                                        ciclos: 13
                                  additionalProperties: false
                                  required:
                                  - tipo
                                  - cobranca
                              additionalProperties: false
                              example:
                                url: )
                            link-pagamento-180:
                              type: object
                              title: camaleao.lib.schema.contracts.sagas.model/LinkPagamento180
                              properties:
                                url:
                                  type: string
                                metodo:
                                  type: object
                                  title: camaleao.lib.schema.contracts.sagas.model/MetodoPagamento
