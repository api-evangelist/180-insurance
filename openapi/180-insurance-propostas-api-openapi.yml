                            - asus
                            - lenovo
                            - realme
                            - motorola
                            - iqoo
                            - micromax
                            - poco
                            - oppo
                            - lava
                            - tecno
                            - meizu
                            - honor
                            - oneplus
                            - zte
                            - nokia
                            - xiaomi
                            - apple
                            - razer
                            - sony
                            - sharp
                            - google
                            - tcl
                            - infinix
                            - blackberry
                            - alcatel
                            - vivo
                          modelo:
                            type: string
                            pattern: ^[a-zA-Z][\w\s\+]*[\w\+]$
                            example: a23z
                          valor:
                            type: number
                            format: double
                            example: 4
                          imei:
                            type: string
                            pattern: ^[0-9]*$
                            example: '513239777898705'
                          nota-fiscal:
                            type: string
                            pattern: ^[0-9]*$
                            example: '716283'
                        additionalProperties: false
                        required:
                        - marca
                        - modelo
                        - valor
                      lmi-variavel:
                        type: object
                        title: camaleao.lib.schema.contracts.sagas.model/RiscoLmiVariavel
                        properties:
                          id-externo:
                            type: string
                          descricao:
                            type: string
