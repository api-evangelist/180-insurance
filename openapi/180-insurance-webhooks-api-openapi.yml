      x-operation-id-source: derived
  /sagas/v1/webhooks/{id-webhook}/rotacionar-chave-hmac:
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/WebhookRotacionarChavesHmacResposta
                properties:
                  chave-assinatura-hmac-secundaria:
                    type: string
                  instante-expiracao-chave-hmac-atual:
                    type: string
                    format: date-time
                additionalProperties: false
                required:
                - chave-assinatura-hmac-secundaria
                - instante-expiracao-chave-hmac-atual
      parameters:
      - in: path
        name: id-webhook
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Webhooks
      summary: Rotacionar chave HMAC
      description: Inicia processo para rotacionar chave HMAC da assinatura. A chave atual continua funcionando por 7 dias a partir da chamada deste endpoint. A nova chave retornada deve passar a ser usada dentro deste período.
      operationId: postSagasV1WebhooksByIdWebhookRotacionarChaveHmac
      x-operation-id-source: derived
