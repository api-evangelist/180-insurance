      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  title: camaleao.lib.schema.contracts.sagas.wire-out/WebhookResposta
                  properties:
                    eventos-habilitados:
                      type: array
                      items:
                        type: string
                        enum:
                        - renovacao-completa
                        - renovacao-iniciada
                        - proposta-requisicao-de-cancelamento-completa
                        - sinistro-pendente-de-dados-de-pagamento
                        - venda-completa
                        - sinistro-pagamento
                        - sinistro-finalizado
                        - renovacao-cancelada
                        - venda-criada
                        - proposta-documentos-renderizados
                        - sinistro-documentacao-aprovada
                        - proposta-expirada
                        - renovacao-disponivel
                        - sinistro-reaberto
                        - sinistro-criado
                        - proposta-requisicao-de-cancelamento-criada
                        - venda-requisicao-de-cancelamento-criada
                        - proposta-criada
                        - sinistro-pagamento-concluido
                        - sinistro-ajuste-de-reserva
                        - venda-documentos-renderizados
                        - cancelamento-pagamento-concluido
                        - sinistro-documentacao-negada
                        - sinistro-documentacao-em-analise
                        - venda-requisicao-de-cancelamento-completa
                        - sinistro-negado
                    url:
                      type: string
                    instante-atualizacao:
                      type: string
                      format: date-time
                    descricao:
                      type: string
                    id:
                      type: string
                      format: uuid
                    ativo:
                      type: boolean
                    instante-criacao:
                      type: string
                      format: date-time
                    envia-header-de-autorizacao:
                      type: boolean
                    hmac-habilitado:
                      type: boolean
                  additionalProperties: false
                  required:
                  - instante-atualizacao
                  - descricao
                  - ativo
                  - id
                  - url
                  - eventos-habilitados
                  - instante-criacao
      tags:
      - Webhooks
      summary: Listar assinaturas
      description: Endpoint utilizado para obter os webhooks ativos e suas respectivas urls.
      operationId: getSagasV1Webhooks
      x-operation-id-source: derived
    post:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                title: camaleao.lib.schema.contracts.sagas.wire-out/CriarWebhookResposta
                properties:
                  eventos-habilitados:
                    type: array
                    items:
                      type: string
                      enum:
                      - renovacao-completa
                      - renovacao-iniciada
                      - proposta-requisicao-de-cancelamento-completa
                      - sinistro-pendente-de-dados-de-pagamento
                      - venda-completa
                      - sinistro-pagamento
                      - sinistro-finalizado
                      - renovacao-cancelada
                      - venda-criada
                      - proposta-documentos-renderizados
                      - sinistro-documentacao-aprovada
                      - proposta-expirada
                      - renovacao-disponivel
                      - sinistro-reaberto
                      - sinistro-criado
                      - proposta-requisicao-de-cancelamento-criada
                      - venda-requisicao-de-cancelamento-criada
                      - proposta-criada
                      - sinistro-pagamento-concluido
                      - sinistro-ajuste-de-reserva
                      - venda-documentos-renderizados
                      - cancelamento-pagamento-concluido
                      - sinistro-documentacao-negada
                      - sinistro-documentacao-em-analise
                      - venda-requisicao-de-cancelamento-completa
                      - sinistro-negado
                  chave-assinatura-hmac:
                    type: string
                  url:
                    type: string
                  instante-atualizacao:
                    type: string
                    format: date-time
                  descricao:
                    type: string
                  id:
                    type: string
                    format: uuid
                  ativo:
                    type: boolean
                  instante-criacao:
                    type: string
                    format: date-time
                  envia-header-de-autorizacao:
                    type: boolean
                  hmac-habilitado:
                    type: boolean
                additionalProperties: false
                required:
                - instante-atualizacao
                - descricao
                - ativo
                - id
                - url
                - eventos-habilitados
                - instante-criacao
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: camaleao.lib.schema.contracts.sagas.wire-in/CriarWebhook
              properties:
                descricao:
                  type: string
                ativo:
                  type: boolean
                url:
                  type: string
                  pattern: ^https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9]{1,24}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&\/=]*)$
                  example: https://lLAB12CNRY2sk.com.br
                eventos-habilitados:
                  type: array
                  items:
                    type: string
                    enum:
                    - renovacao-completa
                    - renovacao-iniciada
                    - proposta-requisicao-de-cancelamento-completa
                    - sinistro-pendente-de-dados-de-pagamento
                    - venda-completa
                    - sinistro-pagamento
                    - sinistro-finalizado
                    - renovacao-cancelada
                    - venda-criada
                    - proposta-documentos-renderizados
                    - sinistro-documentacao-aprovada
                    - proposta-expirada
                    - renovacao-disponivel
                    - sinistro-reaberto
                    - sinistro-criado
                    - proposta-requisicao-de-cancelamento-criada
                    - venda-requisicao-de-cancelamento-criada
                    - proposta-criada
                    - sinistro-pagamento-concluido
                    - sinistro-ajuste-de-reserva
                    - venda-documentos-renderizados
                    - cancelamento-pagamento-concluido
                    - sinistro-documentacao-negada
                    - sinistro-documentacao-em-analise
                    - venda-requisicao-de-cancelamento-completa
                    - sinistro-negado
                segredo-compartilhado:
                  type: string
                  pattern: ^.{12,128}$
                  example: '4169928530114250265851470867739531163258518554405331459755982240718310681040'
                hmac-habilitado:
                  type: boolean
              additionalProperties: false
              required:
              - descricao
              - ativo
              - url
              - eventos-habilitados
        required: true
      tags:
      - Webhooks
      summary: Criar nova assinatura para eventos
      description: 'Endpoint utilizado para cadastrar uma url que será utilizada no envio de webhooks.


        A url cadastrada deverá obrigatoriamente responder ao verbo POST e retonar o status da família 2xx (Exemplo: status 204).'
      operationId: postSagasV1Webhooks
      x-operation-id-source: derived
