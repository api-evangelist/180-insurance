      - in: path
        name: id-webhook
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Webhooks
      summary: Remover assinatura
      description: 'Endpoint utilizado para remover permanentemente uma assinatura de webhook.


        Caso a assinatura seja removida através desse endpoint, não será possível mais reativá-la. Logo, será necessário realizar o cadastro de uma nova assinatura.'
      operationId: deleteSagasV1WebhooksByIdWebhook
      x-operation-id-source: derived
