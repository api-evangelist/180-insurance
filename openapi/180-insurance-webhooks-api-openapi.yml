      summary: Atualizar assinatura
      description: 'Endpoint utilizado para atualizar as informações de uma assinatura de webhook.


        Caso queira desativar o envio para uma determinada url temporariamente, basta utilizar este endpoint para atualizar o parâmetro `ativo` para `false`.'
